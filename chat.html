<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灰太羊羊君 助手</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a1a;
    --bg-2: #12122a;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.1);
    --text: #e8e6f0;
    --text-dim: rgba(255,255,255,0.45);
    --accent: #7c6ef0;
    --accent-glow: rgba(124,110,240,0.3);
    --user-bg: linear-gradient(135deg, #7c6ef0, #a855f7);
    --bot-bg: rgba(255,255,255,0.06);
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    background: rgba(10,10,26,0.9);
    backdrop-filter: blur(20px);
    z-index: 10;
  }
  .back-btn {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    width: 36px; height: 36px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    text-decoration: none;
    transition: background 0.2s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.1); }
  .header-info { flex: 1; }
  .header-title {
    font-size: 1.05rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-title .dot {
    width: 8px; height: 8px;
    background: #4ade80;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .header-sub { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
  .new-chat-btn {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 8px 16px;
    color: var(--text);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .new-chat-btn:hover { background: var(--accent); border-color: var(--accent); }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  .msg-wrap {
    padding: 8px 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  .msg-wrap.user { align-items: flex-end; }
  .msg-wrap.bot { align-items: flex-start; }

  .msg-role {
    font-size: 0.7rem;
    color: var(--text-dim);
    padding: 0 4px;
  }
  .msg-bubble {
    max-width: 700px;
    width: fit-content;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 0.9rem;
    line-height: 1.7;
    word-break: break-word;
  }
  .msg-wrap.user .msg-bubble {
    background: var(--user-bg);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-wrap.bot .msg-bubble {
    background: var(--bot-bg);
    color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--glass-border);
  }
  .msg-bubble img {
    max-width: 300px;
    border-radius: 10px;
    margin-top: 8px;
    display: block;
  }
  .msg-bubble.bot-img { max-width: 320px; }
  .msg-bubble p { margin: 0 0 8px 0; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble code {
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.85em;
  }
  .msg-bubble pre {
    background: rgba(0,0,0,0.3);
    padding: 12px 16px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-bubble pre code { background: none; padding: 0; }
  .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 8px 0; }
  .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { margin: 12px 0 6px; }
  .msg-bubble h1 { font-size: 1.2rem; }
  .msg-bubble h2 { font-size: 1.05rem; }
  .msg-bubble blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    margin: 8px 0;
    color: var(--text-dim);
  }

  /* Typing */
  .typing-indicator {
    padding: 8px 24px;
    display: none;
  }
  .typing-indicator.show { display: flex; }
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    background: var(--bot-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

  /* Welcome */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px;
    text-align: center;
  }
  .welcome-icon { font-size: 3rem; }
  .welcome h2 {
    font-size: 1.4rem;
    font-weight: 600;
    background: linear-gradient(135deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .welcome p { color: var(--text-dim); font-size: 0.9rem; max-width: 400px; }
  .quick-prompts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
    max-width: 500px;
  }
  .quick-prompt {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.82rem;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-prompt:hover {
    background: rgba(124,110,240,0.15);
    border-color: var(--accent);
    color: var(--text);
  }

  /* Input Area */
  .input-area {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--glass-border);
    flex-shrink: 0;
    background: rgba(10,10,26,0.9);
    backdrop-filter: blur(20px);
  }
  .preview-bar {
    display: none;
    padding: 0 0 10px;
    align-items: center;
    gap: 10px;
  }
  .preview-bar.show { display: flex; }
  .preview-bar img { width: 48px; height: 48px; object-fit: cover; border-radius: 10px; border: 1px solid var(--glass-border); }
  .preview-bar .preview-del {
    color: var(--text-dim);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.2s;
  }
  .preview-bar .preview-del:hover { color: #f87171; }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 8px 12px;
    transition: border-color 0.2s;
  }
  .input-row:focus-within { border-color: var(--accent); }

  .input-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .input-icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: all 0.2s;
  }
  .input-icon-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }

  .chat-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
    resize: none;
    outline: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 6px 0;
  }
  .chat-input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Responsive */
  @media (max-width: 600px) {
    .header { padding: 12px 16px; }
    .msg-wrap { padding: 8px 16px; }
    .msg-bubble { max-width: 100%; font-size: 0.85rem; }
    .input-area { padding: 12px 16px 20px; }
    .welcome { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="/" class="back-btn">←</a>
  <div class="header-info">
    <div class="header-title"><span class="dot"></span>灰太羊羊君</div>
    <div class="header-sub">Powered by MiMo v2.5 · 灰太羊羊君</div>
  </div>
  <button class="new-chat-btn" onclick="newChat()">新建对话</button>
</div>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">🤖</div>
    <h2>你好，我是灰太羊羊君</h2>
    <p>有什么我可以帮你的？你也可以发送图片让我分析。</p>
    <div class="quick-prompts">
      <div class="quick-prompt" onclick="quickSend('帮我写一段 Python 爬虫代码')">写爬虫代码</div>
      <div class="quick-prompt" onclick="quickSend('解释一下什么是 Docker')">解释 Docker</div>
      <div class="quick-prompt" onclick="quickSend('帮我优化这段代码的性能')">优化代码</div>
      <div class="quick-prompt" onclick="quickSend('今天心情不好，聊聊天')">聊聊天</div>
    </div>
  </div>
</div>

<div class="typing-indicator" id="typing">
  <div class="typing-dots"><span></span><span></span><span></span></div>
</div>

<div class="input-area">
  <div class="preview-bar" id="preview-bar">
    <img id="preview-img">
    <span class="preview-del" onclick="clearImage()">✕ 移除图片</span>
  </div>
  <div class="input-row">
    <div class="input-actions">
      <button class="input-icon-btn" onclick="document.getElementById('file-input').click()" title="上传图片">📷</button>
    </div>
    <textarea class="chat-input" id="chat-input" rows="1" placeholder="输入消息，Shift+Enter 换行..." onkeydown="handleKey(event)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendChat()" title="发送">➤</button>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleImage(event)">
  </div>
</div>

<script>
let chatHistory = [];
let chatImage = null;
let sending = false;

function quickSend(text) {
  document.getElementById('chat-input').value = text;
  sendChat();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

function handleImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    chatImage = ev.target.result;
    document.getElementById('preview-img').src = chatImage;
    document.getElementById('preview-bar').classList.add('show');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function clearImage() {
  chatImage = null;
  document.getElementById('preview-bar').classList.remove('show');
}

function addMsg(role, content, imageSrc) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + role;

  const roleLabel = document.createElement('div');
  roleLabel.className = 'msg-role';
  roleLabel.textContent = role === 'user' ? '你' : '灰太羊羊君';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (role === 'bot') bubble.innerHTML = renderMarkdown(content);
  else bubble.textContent = content;

  if (imageSrc) {
    const img = document.createElement('img');
    img.src = imageSrc;
    bubble.appendChild(img);
  }

  wrap.appendChild(roleLabel);
  wrap.appendChild(bubble);
  document.getElementById('messages').appendChild(wrap);
  scrollBottom();
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function renderMarkdown(text) {
  // Simple markdown rendering
  let html = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Code blocks
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Blockquote
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // Unordered list
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent)">$1</a>')
    // Line breaks
    .replace(/\n/g, '<br>');

  // Wrap adjacent li tags
  html = html.replace(/(<li>.*?<\/li>(<br>)?)+/g, match => '<ul>' + match.replace(/<br>/g, '') + '</ul>');

  return html;
}

async function sendChat() {
  if (sending) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text && !chatImage) return;

  sending = true;
  document.getElementById('send-btn').disabled = true;

  const userMsg = text || (chatImage ? '[发送了一张图片]' : '');
  addMsg('user', userMsg, chatImage);
  chatHistory.push({ role: 'user', content: userMsg });

  input.value = '';
  input.style.height = 'auto';
  clearImage();

  const typing = document.getElementById('typing');
  typing.classList.add('show');
  scrollBottom();

  try {
    const body = { messages: chatHistory };
    if (chatImage) body.image = chatImage;

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    typing.classList.remove('show');

    if (data.reply) {
      addMsg('bot', data.reply);
      chatHistory.push({ role: 'assistant', content: data.reply });
    } else {
      addMsg('bot', '抱歉，出了点问题：' + (data.error || '未知错误'));
    }
  } catch (e) {
    typing.classList.remove('show');
    addMsg('bot', '网络错误，请稍后重试');
  }

  sending = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

function newChat() {
  chatHistory = [];
  chatImage = null;
  clearImage();
  document.getElementById('messages').innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🤖</div>
      <h2>你好，我是灰太羊羊君</h2>
      <p>有什么我可以帮你的？你也可以发送图片让我分析。</p>
      <div class="quick-prompts">
        <div class="quick-prompt" onclick="quickSend('帮我写一段 Python 爬虫代码')">写爬虫代码</div>
        <div class="quick-prompt" onclick="quickSend('解释一下什么是 Docker')">解释 Docker</div>
        <div class="quick-prompt" onclick="quickSend('帮我优化这段代码的性能')">优化代码</div>
        <div class="quick-prompt" onclick="quickSend('今天心情不好，聊聊天')">聊聊天</div>
      </div>
    </div>`;
}

// Auto-resize textarea
document.getElementById('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
